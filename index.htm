<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScanPrice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { navy: "#0f1b3d", brand: "#2563eb" } } },
      };
    </script>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
      }
      .card {
        background: #fff;
        border-radius: 1.25rem;
        box-shadow: 0 4px 20px rgba(15, 27, 61, 0.07);
      }
      .btn {
        padding: 0.65rem 1.1rem;
        border-radius: 0.8rem;
        font-weight: 600;
        transition: 0.2s;
      }
      .btn-p {
        background: #2563eb;
        color: #fff;
      }
      .btn-p:hover {
        background: #1d4ed8;
      }
      .btn-s {
        background: #eef2ff;
        color: #2563eb;
      }
      .btn-d {
        background: #fee2e2;
        color: #b91c1c;
      }
      .inp {
        width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 0.8rem;
        padding: 0.65rem 0.9rem;
        outline: none;
      }
      .inp:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px #dbeafe;
      }
      .nav-a.on {
        background: #eef2ff;
        color: #2563eb;
      }
      .fade {
        animation: f 0.25s;
      }
      @keyframes f {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-navy">
    <div class="md:flex min-h-screen">
      <aside
        class="hidden md:flex flex-col w-60 bg-white p-4 gap-1 shadow-sm sticky top-0 h-screen"
      >
        <div class="text-2xl font-extrabold text-brand mb-6 px-2">
          ScanPrice
        </div>
        <div id="side" class="flex flex-col gap-1"></div>
      </aside>
      <main
        class="flex-1 p-4 md:p-8 pb-24 md:pb-8 max-w-4xl mx-auto w-full"
        id="app"
      ></main>
    </div>
    <nav
      id="bottom"
      class="md:hidden fixed bottom-0 inset-x-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,.08)] flex justify-around p-1 z-10"
    ></nav>
    <div id="toast" class="fixed top-4 right-4 z-50"></div>

    <script>
      /* ---------- DB (IndexedDB) ---------- */
      const DB = {
        db: null,
        mem: null,
        seq: 1,
        async open() {
          try {
            if (!window.indexedDB) throw 0;
            await Promise.race([
              new Promise((res, rej) => {
                const r = indexedDB.open("scanprice", 1);
                r.onupgradeneeded = () => {
                  const d = r.result;
                  d.createObjectStore("products", {
                    keyPath: "id",
                    autoIncrement: true,
                  });
                  d.createObjectStore("images", {
                    keyPath: "id",
                    autoIncrement: true,
                  }).createIndex("pid", "pid");
                  d.createObjectStore("scans", {
                    keyPath: "id",
                    autoIncrement: true,
                  });
                };
                r.onsuccess = () => {
                  this.db = r.result;
                  res();
                };
                r.onerror = () => rej(r.error);
                r.onblocked = () => rej();
              }),
              new Promise((_, rej) => setTimeout(rej, 3000)),
            ]);
          } catch {
            this.db = null;
            this.mem = { products: [], images: [], scans: [] };
            setTimeout(
              () =>
                toast(
                  "Browser storage blocked here: data is temporary. Download the file and open it in your browser to save permanently.",
                  1,
                ),
              500,
            );
          }
        },
        req(s, m, f) {
          return new Promise((res, rej) => {
            const t = this.db.transaction(s, m);
            const q = f(t.objectStore(s));
            t.oncomplete = () => res(q && q.result);
            t.onerror = () => rej(t.error);
          });
        },
        all(s) {
          return this.mem
            ? Promise.resolve([...this.mem[s]])
            : this.req(s, "readonly", (o) => o.getAll());
        },
        get(s, k) {
          return this.mem
            ? Promise.resolve(this.mem[s].find((x) => x.id === k))
            : this.req(s, "readonly", (o) => o.get(k));
        },
        put(s, v) {
          if (this.mem) {
            if (v.id == null) v.id = this.seq++;
            const i = this.mem[s].findIndex((x) => x.id === v.id);
            i >= 0 ? (this.mem[s][i] = v) : this.mem[s].push(v);
            if (v.id >= this.seq) this.seq = v.id + 1;
            return Promise.resolve(v.id);
          }
          return this.req(s, "readwrite", (o) => o.put(v));
        },
        del(s, k) {
          if (this.mem) {
            this.mem[s] = this.mem[s].filter((x) => x.id !== k);
            return Promise.resolve();
          }
          return this.req(s, "readwrite", (o) => o.delete(k));
        },
        clear(s) {
          if (this.mem) {
            this.mem[s] = [];
            return Promise.resolve();
          }
          return this.req(s, "readwrite", (o) => o.clear());
        },
        imgsOf(pid) {
          return this.mem
            ? Promise.resolve(this.mem.images.filter((i) => i.pid === pid))
            : this.req("images", "readonly", (o) => o.index("pid").getAll(pid));
        },
      };

      /* ---------- Settings (LocalStorage) ---------- */
      let _ss = {};
      const S = {
        get() {
          let o = {};
          try {
            o = JSON.parse(localStorage.getItem("sp_set") || "{}");
          } catch {
            o = _ss;
          }
          return Object.assign({ cur: "៛", high: 0.85, low: 0.65 }, o, {
            cur: !o.cur || o.cur === "$" ? "៛" : o.cur,
          });
        },
        set(v) {
          _ss = v;
          try {
            localStorage.setItem("sp_set", JSON.stringify(v));
          } catch {}
        },
      };
      const money = (n) =>
        Math.round(Number(n)).toLocaleString("en-US") + " " + S.get().cur;
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const toast = (m, e) => {
        const t = document.getElementById("toast");
        t.innerHTML = `<div class="fade px-4 py-3 rounded-xl text-white shadow-lg ${e ? "bg-red-600" : "bg-navy"}">${esc(m)}</div>`;
        setTimeout(() => (t.innerHTML = ""), 3500);
      };
      const fmtDate = (t) => new Date(t).toLocaleString();
      const blobToDataURL = (b) =>
        new Promise((r) => {
          const f = new FileReader();
          f.onload = () => r(f.result);
          f.readAsDataURL(b);
        });
      const dataURLToBlob = async (u) => (await fetch(u)).blob();

      /* ---------- Image processing & recognition ---------- */
      const IMG = {
        model: null,
        loading: null,
        failed: false,
        async load() {
          if (this.model) return this.model;
          if (this.failed) throw new Error("model unavailable");
          if (!this.loading)
            this.loading = Promise.race([
              new Promise((res, rej) => {
                if (
                  typeof mobilenet === "undefined" ||
                  typeof tf === "undefined"
                )
                  return rej(new Error("AI library not loaded"));
                mobilenet.load({ version: 2, alpha: 1.0 }).then(res, rej);
              }),
              new Promise((_, rej) =>
                setTimeout(
                  () => rej(new Error("Model download timed out")),
                  60000,
                ),
              ),
            ])
              .then((m) => (this.model = m))
              .catch((e) => {
                this.failed = true;
                throw e;
              });
          return this.loading;
        },
        async toCanvas(blob, max) {
          let bmp;
          try {
            bmp = await createImageBitmap(blob);
          } catch {
            throw new Error("Corrupted or unsupported image");
          }
          const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
          const c = document.createElement("canvas");
          c.width = Math.round(bmp.width * sc);
          c.height = Math.round(bmp.height * sc);
          c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
          bmp.close && bmp.close();
          return c;
        },
        async thumb(blob) {
          const c = await this.toCanvas(blob, 640);
          return new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
        },
        basic(c) {
          const z = document.createElement("canvas");
          z.width = z.height = 16;
          const x = z.getContext("2d");
          x.drawImage(c, 0, 0, 16, 16);
          const d = x.getImageData(0, 0, 16, 16).data;
          const h = new Array(64).fill(0),
            g = [];
          for (let i = 0; i < d.length; i += 4) {
            h[(d[i] >> 6) * 16 + (d[i + 1] >> 6) * 4 + (d[i + 2] >> 6)]++;
            g.push(0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2]);
          }
          const hs = h.map(Math.sqrt),
            hm = hs.reduce((a, b) => a + b) / 64,
            gm = g.reduce((a, b) => a + b) / g.length;
          const v = [...hs.map((a) => a - hm), ...g.map((a) => (a - gm) / 16)];
          const n = Math.hypot(...v) || 1;
          return v.map((a) => a / n);
        },
        async embed(blob) {
          let m = null;
          try {
            m = await this.load();
          } catch {}
          const c = await this.toCanvas(blob, 224);
          if (!m) return this.basic(c);
          const v = tf.tidy(() => {
            const x = tf.browser.fromPixels(c);
            const e = m.infer(x, true);
            return e.squeeze();
          });
          const a = Array.from(await v.data());
          v.dispose();
          const n = Math.hypot(...a) || 1;
          return a.map((x) => x / n);
        },
      };
      const cosine = (a, b) => {
        let s = 0;
        for (let i = 0; i < a.length; i++) s += a[i] * b[i];
        return s;
      }; // vectors pre-normalized

      async function matchProducts(emb) {
        const [prods, imgs] = await Promise.all([
          DB.all("products"),
          DB.all("images"),
        ]);
        const best = {};
        for (const im of imgs) {
          if (im.emb.length !== emb.length) continue;
          const s = cosine(emb, im.emb);
          if (!(im.pid in best) || s > best[im.pid].s)
            best[im.pid] = { s, imgId: im.id };
        }
        return prods
          .filter((p) => best[p.id])
          .map((p) => ({ p, s: best[p.id].s, imgId: best[p.id].imgId }))
          .sort((a, b) => b.s - a.s);
      }

      /* ---------- Layout ---------- */
      const NAV = [
        ["dashboard", "Dashboard", "M3 12l9-9 9 9M5 10v10h14V10"],
        [
          "scan",
          "Scan Product",
          "M4 8V5a1 1 0 011-1h3M20 8V5a1 1 0 00-1-1h-3M4 16v3a1 1 0 001 1h3M20 16v3a1 1 0 01-1 1h-3M4 12h16",
        ],
        ["products", "Products", "M20 7l-8-4-8 4v10l8 4 8-4z"],
        ["add", "Add Product", "M12 5v14M5 12h14"],
        ["history", "Scan History", "M12 8v4l3 2M21 12a9 9 0 11-3-6.7"],
        [
          "settings",
          "Settings",
          "M12 15a3 3 0 100-6 3 3 0 000 6zM19 12h2M3 12h2M12 3v2M12 19v2",
        ],
      ];
      const ico = (d) =>
        `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
      function drawNav(cur) {
        document.getElementById("side").innerHTML = NAV.map(
          (n) =>
            `<a href="#${n[0]}" class="nav-a ${cur === n[0] ? "on" : ""} flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium hover:bg-slate-100">${ico(n[2])}${n[1]}</a>`,
        ).join("");
        document.getElementById("bottom").innerHTML = NAV.map(
          (n) =>
            `<a href="#${n[0]}" class="nav-a ${cur === n[0] ? "on" : ""} flex flex-col items-center text-[10px] px-2 py-1.5 rounded-xl">${ico(n[2])}<span>${n[1].split(" ")[0]}</span></a>`,
        ).join("");
      }

      let camStream = null;
      const stopCam = () => {
        camStream && camStream.getTracks().forEach((t) => t.stop());
        camStream = null;
      };
      const urls = [];
      const objUrl = (b) => {
        const u = URL.createObjectURL(b);
        urls.push(u);
        return u;
      };
      const clearUrls = () => {
        urls.splice(0).forEach(URL.revokeObjectURL);
      };
      const app = () => document.getElementById("app");
      const head = (t, s) =>
        `<div class="mb-6"><h1 class="text-2xl md:text-3xl font-extrabold">${t}</h1>${s ? `<p class="text-slate-500">${s}</p>` : ""}</div>`;

      async function firstImg(pid) {
        const l = await DB.imgsOf(pid);
        return l[0] ? objUrl(l[0].blob) : "";
      }
      function priceCard(p, src, conf) {
        return `<div class="card overflow-hidden fade">${src ? `<img src="${src}" class="w-full h-64 object-cover">` : ""}
 <div class="p-5"><div class="text-slate-500 text-sm">Product</div><div class="text-xl font-bold">${esc(p.name)}</div>
 <div class="text-5xl md:text-6xl font-extrabold text-brand my-3">${money(p.price)}</div>
 ${p.desc ? `<p class="text-slate-600">${esc(p.desc)}</p>` : ""}
 ${conf != null ? `<div class="mt-3 text-sm text-slate-500">Confidence: <b>${(conf * 100).toFixed(0)}%</b></div>` : ""}</div></div>`;
      }

      /* ---------- Pages ---------- */
      const pages = {
        async dashboard() {
          const [ps, im, sc] = await Promise.all([
            DB.all("products"),
            DB.all("images"),
            DB.all("scans"),
          ]);
          const rp = [...ps].sort((a, b) => b.created - a.created).slice(0, 4),
            rs = [...sc].sort((a, b) => b.time - a.time).slice(0, 4);
          const st = (l, v) =>
            `<div class="card p-5"><div class="text-slate-500 text-sm">${l}</div><div class="text-3xl font-extrabold text-brand">${v}</div></div>`;
          const list = (a, f) =>
            a.length
              ? a.map(f).join("")
              : '<p class="text-slate-400 text-sm">Nothing yet</p>';
          app().innerHTML =
            head("Dashboard", "Your product recognition overview") +
            `<div class="grid grid-cols-3 gap-3 md:gap-4 mb-6">${st("Products", ps.length)}${st("Images", im.length)}${st("Scans", sc.length)}</div>
 <a href="#scan" class="btn btn-p block text-center text-lg mb-6">📷 Scan a Product</a>
 <div class="grid md:grid-cols-2 gap-4"><div class="card p-5"><h3 class="font-bold mb-3">Recently Added</h3>${list(rp, (p) => `<div class="flex justify-between py-1.5 border-b border-slate-100"><span>${esc(p.name)}</span><b>${money(p.price)}</b></div>`)}</div>
 <div class="card p-5"><h3 class="font-bold mb-3">Recently Scanned</h3>${list(rs, (s) => `<div class="flex justify-between py-1.5 border-b border-slate-100"><span>${esc(s.name)}</span><b>${money(s.price)}</b></div>`)}</div></div>`;
        },

        async products() {
          const ps = (await DB.all("products")).sort(
            (a, b) => b.created - a.created,
          );
          app().innerHTML =
            head("Products", ps.length + " registered") +
            `<input id="q" class="inp mb-4" placeholder="Search products by name...">
 <div id="plist" class="grid sm:grid-cols-2 gap-4"></div>`;
          const thumbs = {};
          for (const p of ps) thumbs[p.id] = await firstImg(p.id);
          const draw = (q) => {
            const f = ps.filter((p) =>
              p.name.toLowerCase().includes(q.toLowerCase()),
            );
            document.getElementById("plist").innerHTML = f.length
              ? f
                  .map(
                    (p) => `<div class="card p-3 flex gap-3 items-center fade">
  ${thumbs[p.id] ? `<img src="${thumbs[p.id]}" class="w-20 h-20 rounded-xl object-cover">` : '<div class="w-20 h-20 rounded-xl bg-slate-100"></div>'}
  <div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(p.name)}</div><div class="text-xl font-extrabold text-brand">${money(p.price)}</div>
  <div class="flex gap-2 mt-1"><a href="#add/${p.id}" class="btn btn-s !py-1 !px-3 text-sm">Edit</a><button data-del="${p.id}" class="btn btn-d !py-1 !px-3 text-sm">Delete</button></div></div></div>`,
                  )
                  .join("")
              : '<p class="text-slate-400">No products found.</p>';
            document.querySelectorAll("[data-del]").forEach(
              (b) =>
                (b.onclick = async () => {
                  if (!confirm("Delete this product and its images?")) return;
                  const id = +b.dataset.del;
                  for (const im of await DB.imgsOf(id))
                    await DB.del("images", im.id);
                  await DB.del("products", id);
                  toast("Deleted");
                  route();
                }),
            );
          };
          draw("");
          document.getElementById("q").oninput = (e) => draw(e.target.value);
        },

        async add(id) {
          const edit = id ? await DB.get("products", +id) : null;
          let items = [];
          const removed = [];
          if (edit)
            for (const im of await DB.imgsOf(edit.id))
              items.push({ id: im.id, blob: im.blob, emb: im.emb });
          app().innerHTML =
            head(
              edit ? "Edit Product" : "Add Product",
              "Add several photos from different angles for better accuracy",
            ) +
            `<div class="card p-5 space-y-4"><div><label class="text-sm font-semibold">Product name *</label><input id="n" class="inp" value="${esc(edit?.name)}" placeholder="e.g. Coca-Cola 330ml / ឈ្មោះផលិតផល"></div>
 <div><label class="text-sm font-semibold">Selling price (៛ Riel) * / តម្លៃលក់ (រៀល)</label><div class="relative"><input id="pr" type="number" step="100" min="0" inputmode="numeric" class="inp pr-10" value="${edit ? edit.price : ""}" placeholder="e.g. 3000"><span class="absolute right-4 top-1/2 -translate-y-1/2 font-bold text-slate-400">៛</span></div></div>
 <div><label class="text-sm font-semibold">Description (optional)</label><textarea id="d" rows="2" class="inp">${esc(edit?.desc)}</textarea></div>
 <div><label class="text-sm font-semibold">Reference images</label><label for="f" class="mt-1 flex flex-col items-center justify-center gap-2 text-center cursor-pointer rounded-2xl border-2 border-dashed border-blue-200 bg-blue-50/60 hover:bg-blue-50 hover:border-brand transition py-8 px-4">
 <span class="w-14 h-14 rounded-full bg-white shadow flex items-center justify-center text-brand"><svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 16l4-4 4 4 4-6 4 6M4 20h16M7 8h.01"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg></span>
 <span class="font-bold text-brand">Choose photos / ជ្រើសរើសរូបភាព</span>
 <span class="text-xs text-slate-500">Tap to browse or take photos · JPG, PNG · multiple allowed</span></label>
 <input id="f" type="file" accept="image/*" multiple class="hidden"><div id="th" class="grid grid-cols-4 gap-2 mt-3"></div></div>
 <button id="sv" class="btn btn-p w-full">${edit ? "Save changes" : "Save product"}</button></div>`;
          const th = () => {
            document.getElementById("th").innerHTML = items
              .map(
                (it, i) =>
                  `<div class="relative"><img src="${objUrl(it.blob)}" class="aspect-square object-cover rounded-xl"><button data-r="${i}" class="absolute top-1 right-1 bg-white/90 rounded-full w-6 h-6 text-red-600 font-bold">×</button></div>`,
              )
              .join("");
            document.querySelectorAll("[data-r]").forEach(
              (b) =>
                (b.onclick = () => {
                  const it = items.splice(+b.dataset.r, 1)[0];
                  if (it.id) removed.push(it.id);
                  th();
                }),
            );
          };
          th();
          document.getElementById("f").onchange = (e) => {
            for (const f of e.target.files)
              items.push({ blob: f, isNew: true });
            e.target.value = "";
            th();
          };
          document.getElementById("sv").onclick = async (e) => {
            const name = document.getElementById("n").value.trim(),
              price = parseFloat(document.getElementById("pr").value);
            if (!name || isNaN(price) || price < 0)
              return toast("Enter a name and a valid price", 1);
            if (!items.length) return toast("Add at least one image", 1);
            e.target.disabled = true;
            e.target.textContent =
              "Processing images… (first time downloads the AI model)";
            try {
              const pid = await DB.put("products", {
                ...(edit || {}),
                name,
                price,
                desc: document.getElementById("d").value.trim(),
                created: edit?.created || Date.now(),
              });
              for (const r of removed) await DB.del("images", r);
              for (const it of items) {
                if (!it.isNew) continue;
                const t = await IMG.thumb(it.blob);
                const emb = await IMG.embed(t);
                await DB.put("images", {
                  pid: edit ? edit.id : pid,
                  blob: t,
                  emb,
                });
              }
              toast("Product saved");
              go("products");
            } catch (err) {
              toast(err.message, 1);
              e.target.disabled = false;
              e.target.textContent = "Save product";
            }
          };
        },

        async scan() {
          app().innerHTML =
            head("Scan Product", "Take a photo of a registered product") +
            `<div class="card p-4"><div id="stage" class="relative rounded-2xl overflow-hidden bg-black aspect-[4/3] flex items-center justify-center">
 <video id="v" playsinline muted autoplay class="w-full h-full object-cover"></video><img id="shot" class="hidden w-full h-full object-cover absolute inset-0">
 <div id="ld" class="hidden absolute inset-0 bg-white/80 flex-col items-center justify-center gap-3"><div class="w-10 h-10 border-4 border-brand border-t-transparent rounded-full animate-spin"></div><div class="font-semibold">Recognizing…</div></div></div>
 <div id="err" class="text-red-600 text-sm mt-2"></div>
 <div class="flex gap-2 mt-3"><button id="cap" class="btn btn-p flex-1">📸 Capture</button><button id="re" class="btn btn-s hidden flex-1">Retake</button>
 <label class="btn btn-s cursor-pointer text-center">Phone camera<input id="up2" type="file" accept="image/*" capture="environment" class="hidden"></label><label class="btn btn-s cursor-pointer text-center">Upload<input id="up" type="file" accept="image/*" class="hidden"></label></div></div><div id="res" class="mt-5"></div>`;
          const v = document.getElementById("v"),
            shot = document.getElementById("shot"),
            $ = (id) => document.getElementById(id);
          let busy = false;
          const startCam = async () => {
            $("err").textContent = "";
            if (!navigator.mediaDevices?.getUserMedia) {
              $("err").textContent =
                "Camera not supported here (use HTTPS or localhost). You can still upload a photo.";
              return;
            }
            try {
              camStream = await navigator.mediaDevices.getUserMedia({
                video: {
                  facingMode: { ideal: "environment" },
                  width: { ideal: 1280 },
                },
                audio: false,
              });
              v.srcObject = camStream;
            } catch (e) {
              $("err").textContent =
                e.name === "NotAllowedError"
                  ? "Camera permission denied. Allow it in browser settings, or upload a photo."
                  : "Cannot access camera: " + e.message;
            }
          };
          const run = async (blob) => {
            if (busy) return;
            busy = true;
            $("res").innerHTML = "";
            shot.src = objUrl(blob);
            shot.classList.remove("hidden");
            $("re").classList.remove("hidden");
            $("cap").classList.add("hidden");
            $("ld").classList.replace("hidden", "flex");
            try {
              const emb = await IMG.embed(blob);
              const m = await matchProducts(emb);
              const set = S.get();
              const basic = emb.length < 1000;
              if (basic) {
                set.high = 0.9;
                set.low = 0.7;
                $("res").innerHTML =
                  '<div class="text-xs text-amber-600 mb-2">Basic color-matching mode (AI model not loaded)</div>';
              }
              if (!m.length)
                $("res").innerHTML +=
                  '<div class="card p-6 text-center text-slate-500">No products registered yet. <a class="text-brand font-semibold" href="#add">Add one</a></div>';
              else if (m[0].s >= set.high) await show(m[0]);
              else if (m[0].s >= set.low) {
                const cs = m.filter((x) => x.s >= set.low).slice(0, 4);
                $("res").innerHTML +=
                  `<div class="card p-5"><h3 class="font-bold mb-1">Possible matches</h3><p class="text-sm text-slate-500 mb-3">Low confidence — tap the correct product.</p><div class="space-y-2">${cs.map((c, i) => `<button data-c="${i}" class="w-full text-left p-3 rounded-xl bg-slate-50 hover:bg-blue-50 flex justify-between"><span>${esc(c.p.name)}</span><span class="text-slate-500">${(c.s * 100).toFixed(0)}%</span></button>`).join("")}</div></div>`;
                document
                  .querySelectorAll("[data-c]")
                  .forEach((b) => (b.onclick = () => show(cs[+b.dataset.c])));
              } else
                $("res").innerHTML +=
                  '<div class="card p-8 text-center"><div class="text-4xl mb-2">🔍</div><div class="text-xl font-bold">Product Not Found</div><p class="text-slate-500 text-sm mt-1">Try another angle, or register this product.</p></div>';
            } catch (e) {
              $("res").innerHTML =
                `<div class="text-red-600">${esc(e.message)}</div>`;
            }
            $("ld").classList.replace("flex", "hidden");
            busy = false;
          };
          const show = async (m) => {
            const l = await DB.imgsOf(m.p.id);
            const im = l.find((x) => x.id === m.imgId) || l[0];
            $("res").innerHTML += priceCard(
              m.p,
              im ? objUrl(im.blob) : "",
              m.s,
            );
            await DB.put("scans", {
              pid: m.p.id,
              name: m.p.name,
              price: m.p.price,
              time: Date.now(),
              blob: im?.blob,
            });
          };
          $("cap").onclick = () => {
            if (!v.videoWidth) return toast("Camera not ready", 1);
            const c = document.createElement("canvas");
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            c.getContext("2d").drawImage(v, 0, 0);
            c.toBlob(run, "image/jpeg", 0.9);
          };
          $("re").onclick = () => {
            shot.classList.add("hidden");
            $("re").classList.add("hidden");
            $("cap").classList.remove("hidden");
            $("res").innerHTML = "";
          };
          $("up2").onchange = $("up").onchange = (e) => {
            const f = e.target.files[0];
            e.target.value = "";
            if (f) run(f);
          };
          IMG.load().catch(() =>
            toast(
              "AI model unavailable (needs internet once). Using basic color matching.",
              1,
            ),
          );
          startCam();
        },

        async history() {
          const sc = (await DB.all("scans")).sort((a, b) => b.time - a.time);
          app().innerHTML =
            head("Scan History", sc.length + " scans") +
            (sc.length
              ? `<button id="cl" class="btn btn-d mb-4">Clear history</button>`
              : "") +
            `<div class="space-y-3">${sc.length ? sc.map((s) => `<div class="card p-3 flex gap-3 items-center">${s.blob ? `<img src="${objUrl(s.blob)}" class="w-16 h-16 rounded-xl object-cover">` : ""}<div class="flex-1"><div class="font-bold">${esc(s.name)}</div><div class="text-xs text-slate-500">${fmtDate(s.time)}</div></div><div class="text-xl font-extrabold text-brand">${money(s.price)}</div></div>`).join("") : '<p class="text-slate-400">No scans yet.</p>'}</div>`;
          const cl = document.getElementById("cl");
          if (cl)
            cl.onclick = async () => {
              if (confirm("Clear all scan history?")) {
                await DB.clear("scans");
                route();
              }
            };
        },

        async settings() {
          const s = S.get();
          app().innerHTML =
            head("Settings") +
            `<div class="card p-5 space-y-4 mb-4"><h3 class="font-bold">Recognition</h3>
 <div><label class="text-sm font-semibold">Currency symbol (default ៛ Riel)</label><input id="cu" class="inp" value="${esc(s.cur)}"></div>
 <div><label class="text-sm font-semibold">Auto-accept confidence: <span id="hv">${Math.round(s.high * 100)}</span>%</label><input id="hi" type="range" min="50" max="99" value="${s.high * 100}" class="w-full"></div>
 <div><label class="text-sm font-semibold">Minimum confidence to suggest: <span id="lv">${Math.round(s.low * 100)}</span>%</label><input id="lo" type="range" min="30" max="95" value="${s.low * 100}" class="w-full"></div>
 <button id="ss" class="btn btn-p">Save settings</button></div>
 <div class="card p-5 space-y-3"><h3 class="font-bold">Backup & Restore</h3><p class="text-sm text-slate-500">Backup includes products, images and features. Data stays on this device; the AI model needs internet once to download.</p>
 <button id="ex" class="btn btn-p">⬇ Export backup</button>
 <label class="btn btn-s cursor-pointer inline-flex items-center gap-2">⬆ Choose backup file / ជ្រើសឯកសារ Backup<input id="im" type="file" accept=".json" class="hidden"></label></div>`;
          const $ = (id) => document.getElementById(id);
          $("hi").oninput = (e) => ($("hv").textContent = e.target.value);
          $("lo").oninput = (e) => ($("lv").textContent = e.target.value);
          $("ss").onclick = () => {
            S.set({
              cur: $("cu").value || "៛",
              high: $("hi").value / 100,
              low: Math.min($("lo").value, $("hi").value) / 100,
            });
            toast("Saved");
          };
          $("ex").onclick = async () => {
            const [p, i, sc] = await Promise.all([
              DB.all("products"),
              DB.all("images"),
              DB.all("scans"),
            ]);
            const data = {
              v: 1,
              products: p,
              images: await Promise.all(
                i.map(async (x) => ({
                  ...x,
                  blob: await blobToDataURL(x.blob),
                })),
              ),
              scans: await Promise.all(
                sc.map(async (x) => ({
                  ...x,
                  blob: x.blob ? await blobToDataURL(x.blob) : null,
                })),
              ),
            };
            const a = document.createElement("a");
            a.href = URL.createObjectURL(
              new Blob([JSON.stringify(data)], { type: "application/json" }),
            );
            a.download =
              "scanprice-backup-" +
              new Date().toISOString().slice(0, 10) +
              ".json";
            a.click();
            toast("Backup exported");
          };
          $("im").onchange = async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            if (!confirm("This replaces all current data. Continue?")) return;
            try {
              const d = JSON.parse(await f.text());
              if (!d.products || !d.images) throw 0;
              for (const s of ["products", "images", "scans"])
                await DB.clear(s);
              for (const p of d.products) await DB.put("products", p);
              for (const i of d.images)
                await DB.put("images", {
                  ...i,
                  blob: await dataURLToBlob(i.blob),
                });
              for (const x of d.scans || [])
                await DB.put("scans", {
                  ...x,
                  blob: x.blob ? await dataURLToBlob(x.blob) : null,
                });
              toast("Restore complete");
            } catch {
              toast("Invalid backup file", 1);
            }
          };
        },
      };

      /* ---------- Router ---------- */
      async function route() {
        stopCam();
        clearUrls();
        const [r, arg] = cur.split("/");
        const k = pages[r] ? r : "dashboard";
        drawNav(k === "add" && arg ? "products" : k);
        try {
          await pages[k](arg);
        } catch (e) {
          app().innerHTML = `<div class="card p-6 text-red-600">Error: ${esc(e.message)}</div>`;
        }
        window.scrollTo(0, 0);
      }
      let cur = "dashboard";
      function go(h) {
        cur = h;
        route();
      }
      document.addEventListener("click", (e) => {
        const a = e.target.closest('a[href^="#"]');
        if (a) {
          e.preventDefault();
          go(a.getAttribute("href").slice(1));
        }
      });
      DB.open()
        .then(route)
        .catch(
          (e) =>
            (document.getElementById("app").textContent =
              "Storage unavailable: " + e.message),
        );
    </script>
  </body>
</html>
